# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

hand_controller:
  ros__parameters:
    joints:
      - index_pip_flex_joint
      - index_pip_abb_joint
      - index_mcp_joint
      - index_dip_joint
      - middle_pip_flex_joint
      - middle_pip_abb_joint
      - middle_mcp_joint
      - middle_dip_joint
      - ring_pip_flex_joint
      - ring_pip_abb_joint
      - ring_mcp_joint
      - ring_dip_joint
      - thumb_cmc_abb_joint
      - thumb_cmc_flex_joint
      - thumb_mcp_joint
      - thumb_ip_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true